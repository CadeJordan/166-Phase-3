{% macro form_field(label, name, type="text", value="", required=false, readonly=false, options=None, rows=3, placeholder="") %}
<div class="mb-3">
    <label for="{{ name }}" class="block text-sm mb-1">{{ label }}{% if required %} *{% endif %}</label>
    {% if type == "textarea" %}
    <textarea id="{{ name }}" name="{{ name }}" rows="{{ rows }}" {% if required %}required{% endif %} {% if readonly %}readonly{% endif %}
              class="w-full border px-2 py-1 text-sm">{{ value }}</textarea>
    {% else %}
    <input type="{{ type }}" id="{{ name }}" name="{{ name }}" value="{{ value }}"
           {% if required %}required{% endif %} {% if readonly %}readonly{% endif %}
           placeholder="{{ placeholder }}"
           class="w-full border px-2 py-1 text-sm {% if readonly %}bg-gray-100{% endif %}">
    {% endif %}
</div>
{% endmacro %}

{% extends "layouts/base.html" %}

{% block title %}Wins{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-lg font-bold mb-4">Wins</h1>
    {% if wins %}
    <table class="w-full text-sm">
        <thead>
            <tr>
                <th class="text-left px-2 py-1">Item</th>
                <th class="text-right px-2 py-1">Amount</th>
                <th class="text-left px-2 py-1">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for win in wins %}
            <tr>
                <td class="px-2 py-1">{{ win.item.item_name }}</td>
                <td class="px-2 py-1 text-right">{{ win.current_highest_bid|currency }}</td>
                <td class="px-2 py-1">
                    <a href="{{ url_for('buyer.payment', auction_id=win.auction_id) }}" class="link">Payment</a> |
                    <a href="{{ url_for('buyer.order_tracking', auction_id=win.auction_id) }}" class="link">Order</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-gray-500">No wins yet.</p>
    {% endif %}
</div>
{% endblock %}

{% extends "layouts/base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-8">
    <h1 class="text-lg font-bold mb-4">Sign In</h1>

    <form method="post" class="space-y-3">
        <div>
            <label for="login" class="block text-sm mb-1">Username</label>
            <input type="text" id="login" name="login" required class="w-full border px-2 py-1 text-sm">
        </div>
        <div>
            <label for="password" class="block text-sm mb-1">Password</label>
            <input type="password" id="password" name="password" required class="w-full border px-2 py-1 text-sm">
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <p class="text-sm mt-4"><a href="{{ url_for('auth.register') }}" class="link">Register</a></p>
</div>
{% endblock %}
